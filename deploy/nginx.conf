# Nginx DENTRO do container. Não é a configuração do proxy do host.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    autoindex off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Sem CSP nesta sprint; scripts e estilos são locais e não há rastreamento.
    # add_header fica neste nível para também atender respostas de erro.

    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }
    location ~* \.(css|js|png|jpe?g|ico|webmanifest)$ {
        try_files $uri =404;
        expires 1h;
    }
    location ~ /\. {
        deny all;
    }
}
